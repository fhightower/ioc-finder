# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_smoke:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.14
      uses: actions/setup-python@v5
      with:
        python-version: '3.14'
    - name: Set up uv
      uses: astral-sh/setup-uv@v6
    - name: Build package
      run: uv build

  build_multi_os:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
        python-version: ['3.14']

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Set up uv
      uses: astral-sh/setup-uv@v6
    - name: Install dependencies
      run: uv sync --locked --group dev
    - name: Run pytest
      run: |
        uv run pytest
        uv run codecov
        # Run benchmark tests against the checked-in baselines. These are
        # absolute per-OS timings regenerated by benchmark-baselines.yml, so
        # this compares two different runner instances and the threshold has
        # to cover runner-to-runner variance.
        #
        # Gate on `min`, and loosely. Measured by running the generator twice
        # over identical code, the spread between two runs of the same
        # benchmark was up to 20.5% on min but 42% on both median and mean —
        # min is the least noise-contaminated statistic, which is why the
        # previous mean:15% / median:25% thresholds could only survive against
        # a baseline stale enough to have ~3x of slack in it. 40% is ~2x the
        # observed worst case, so it should not flake.
        #
        # Know what this does NOT catch. min is the best-case iteration, so it
        # tracks steady-state throughput drift and little else: a regression
        # that only shows up in the tail — an occasional slow path, extra GC
        # pressure, a branch taken 10% of the time — moves median/mean while
        # leaving min flat, and this gate would pass it. Those stats are too
        # noisy across runner instances (42%) to gate on here, so on main this
        # is a coarse drift alarm, not a tight regression gate.
        #
        # The tight, tail-sensitive check is a separate per-PR job that
        # benchmarks the PR's own base commit on a single runner (proposed in
        # PR #411, not part of this branch). Do NOT read the 40% here as "fine
        # because that job backstops it" unless #411 has actually landed on
        # main — until then, this is the only benchmark gate main has.
        uv run pytest -c "." --benchmark-storage=.benchmarks/${{ runner.os == 'macOS' && 'Darwin' || runner.os }}-CPython-${{ matrix.python-version }}-64bit/ --benchmark-compare=0001 --benchmark-compare-fail='min:40%' --benchmark-columns='min,mean,median,stddev,iqr' tests/benchmarks.py

  build_multi_py_versions:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Set up uv
      uses: astral-sh/setup-uv@v6
    - name: Install dependencies
      run: uv sync --locked --group dev
    - name: Run pytest
      run: |
        uv run pytest
        uv run codecov

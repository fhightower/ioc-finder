# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_smoke:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.14
      uses: actions/setup-python@v5
      with:
        python-version: '3.14'
    - name: Set up uv
      uses: astral-sh/setup-uv@v6
    - name: Build package
      run: uv build

  build_multi_os:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
        python-version: ['3.14']

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Set up uv
      uses: astral-sh/setup-uv@v6
    - name: Install dependencies
      run: uv sync --locked --group dev
    - name: Run pytest
      run: |
        uv run pytest
        uv run codecov
        # Run benchmark tests against the checked-in baselines. These are
        # absolute per-OS timings regenerated by benchmark-baselines.yml, so
        # this compares two different runner instances and the threshold has
        # to cover runner-to-runner variance.
        #
        # Gate on `min`, and loosely. Measured by running the generator twice
        # over identical code, the spread between two runs of the same
        # benchmark was up to 20.5% on min but 42% on both median and mean —
        # min is the least noise-contaminated statistic, which is why the
        # previous mean:15% / median:25% thresholds could only survive against
        # a baseline stale enough to have ~3x of slack in it.
        #
        # 40% is ~2x the observed worst case, so it should not flake, and it
        # still catches the cumulative drift this gate exists for. Per-PR
        # regressions are the benchmark_regression job's problem; it compares
        # against the PR's own base on a single runner and can afford to be
        # much tighter.
        uv run pytest -c "." --benchmark-storage=.benchmarks/${{ runner.os == 'macOS' && 'Darwin' || runner.os }}-CPython-${{ matrix.python-version }}-64bit/ --benchmark-compare=0001 --benchmark-compare-fail='min:40%' --benchmark-columns='min,mean,median,stddev,iqr' tests/benchmarks.py

  build_multi_py_versions:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Set up uv
      uses: astral-sh/setup-uv@v6
    - name: Install dependencies
      run: uv sync --locked --group dev
    - name: Run pytest
      run: |
        uv run pytest
        uv run codecov

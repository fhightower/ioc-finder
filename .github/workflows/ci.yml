# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_smoke:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.14
      uses: actions/setup-python@v5
      with:
        python-version: '3.14'
    - name: Set up uv
      uses: astral-sh/setup-uv@v6
    - name: Build package
      run: uv build

  build_multi_os:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
        python-version: ['3.14']

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Set up uv
      uses: astral-sh/setup-uv@v6
    - name: Install dependencies
      run: uv sync --locked --group dev
    - name: Run pytest
      run: |
        uv run pytest
        uv run codecov
        # Compare against the checked-in per-OS baselines (regenerated by
        # benchmark-baselines.yml). Gate on `min`, not mean/median: across
        # runner instances those varied ~42% between two runs of identical
        # code vs ~20% for min, so a mean/median gate tight enough to be useful
        # flakes. 40% is ~2x that worst-case min noise. Caveat: min tracks
        # steady-state throughput only, so it misses tail/GC regressions (which
        # move median/mean) — this is a coarse drift alarm, not a tight gate.
        uv run pytest -c "." --benchmark-storage=.benchmarks/${{ runner.os == 'macOS' && 'Darwin' || runner.os }}-CPython-${{ matrix.python-version }}-64bit/ --benchmark-compare=0001 --benchmark-compare-fail='min:40%' --benchmark-columns='min,mean,median,stddev,iqr' tests/benchmarks.py

  build_multi_py_versions:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Set up uv
      uses: astral-sh/setup-uv@v6
    - name: Install dependencies
      run: uv sync --locked --group dev
    - name: Run pytest
      run: |
        uv run pytest
        uv run codecov
